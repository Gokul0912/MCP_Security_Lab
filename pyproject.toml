[project]
name = "autonomous-security-lab-assistant"
version = "0.4.0"
description = "Safe-by-default MCP-style autonomous assistant for cybersecurity lab workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MCP Demo" }]
dependencies = []
[project.scripts]
security-lab-assistant = "security_lab_assistant.cli:main"
security-lab-mcp = "security_lab_assistant.server:main"
security-lab-cli = "security_lab_assistant.cli:main"
security-lab-gui = "security_lab_assistant.gui:main"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["security_lab_assistant", "tests"]
reportMissingTypeStubs = "warning"
