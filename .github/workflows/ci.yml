name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install type tools
        run: python -m pip install --upgrade pip mypy pyright
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Mypy
        run: mypy security_lab_assistant
      - name: Pyright
        run: pyright
